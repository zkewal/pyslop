# Shipped pyslop ty config: strict. `all = "error"` makes every ty rule an
# error, including rules added in later ty releases; a per-rule entry still
# overrides it, whatever its position. `init` stamps [rules] from here.
# Consumer [tool.mypy] is never read or written by pyslop; both checkers coexist.

[environment]
python-version = "3.12"

[rules]
all = "error"
