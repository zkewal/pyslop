# Shipped ruff config for pyslop. Used via `ruff --config` when the consumer
# pyproject has no [tool.ruff] section; otherwise the consumer config wins.
# Preview off (default). Rule families are documented in docs/config/ruff.md.
target-version = "py312"
preview = false

[lint]
# TRY003 (message text inside `raise`) is exception *style*, not evidence;
# it dominated real adoptions with four-digit counts. Consumers may re-enable.
ignore = ["TRY003"]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "ANN401",
  "BLE",
  "TRY",
  "S110",
  "S112",
  "ERA",
  "ARG",
  "FBT",
  "PLR09",
  "C90",
  "RET",
  "SIM",
  "PERF",
  "FURB",
  "PIE",
  "PGH",
  "RUF",
  "T20",
  "TD",
  "FIX",
]
