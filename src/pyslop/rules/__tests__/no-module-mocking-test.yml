# Fixture test for pyslop/no-module-mocking.
# patch.object and monkeypatch.setattr(obj, "attr", v) are allowed.
id: pyslop/no-module-mocking
valid:
  - |
    patch.object(my_module, "func")
  - |
    mock.patch.object(my_module, "func")
  - |
    monkeypatch.setattr(my_obj, "attr", 1)
  - |
    patch(my_obj)
  - |
    response = client.patch("/review/123/signals", json={})
  - |
    response = client.patch('/items/1')
  - |
    response = client.patch("/api/v1.2/items")
invalid:
  - |
    patch("my.module.func")
  - |
    mock.patch("my.module.func")
  - |
    unittest.mock.patch("my.module.func")
  - |
    um.patch("my.module.func")
  - |
    módulo.patch("paquete.módulo.función")
  - |
    mocker.patch("my.module.func")
  - |
    patch("my.module.func", return_value=1)
  - |
    monkeypatch.setattr("my.module.func", lambda: 1)
