id: pyslop/no-dynamic-attr-on-literal
valid:
  - |
    value = getattr(obj, name)
  - |
    value = getattr(obj, name, default)
  - |
    ok = hasattr(obj, name)
  - |
    setattr(obj, name, value)
  - |
    value = getattr(obj, f"{name}")
  - |
    value = obj.name
  - |
    value = getattr(obj, "prefix_" f"{name}")
  - |
    delattr(obj, name)
invalid:
  - |
    value = getattr(obj, "name")
  - |
    value = getattr(obj, "name", default)
  - |
    ok = hasattr(obj, "name")
  - |
    setattr(obj, "name", value)
  - |
    delattr(obj, "name")
  - |
    value = getattr(obj, "na" "me")
  - |
    value = getattr(obj, 'name')
