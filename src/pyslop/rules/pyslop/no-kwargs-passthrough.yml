id: pyslop/no-kwargs-passthrough
language: python
severity: error
rule:
  kind: function_definition
  all:
    # Public: no leading underscore, or a dunder (`__init__`, `__call__`).
    - has:
        field: name
        regex: "^([^_]|__\\w*__$)"
    - has:
        field: parameters
        has:
          any:
            # **kwargs with no annotation
            - kind: dictionary_splat_pattern
            # **kwargs: T where T is not Unpack[...] or P.kwargs. Unpack may be
            # module-qualified (typing., t., typing_extensions.) or quoted.
            - kind: typed_parameter
              has:
                kind: dictionary_splat_pattern
              not:
                has:
                  field: type
                  any:
                    - regex: "^[\"']?(\\w+\\.)*Unpack\\[.+\\][\"']?$"
                    - regex: "^[\"']?\\w+\\.kwargs[\"']?$"
message: Public function takes **kwargs without a typed contract.
note: "Annotate as **kwargs: Unpack[SomeTypedDict] (or ParamSpec P.kwargs for signature-preserving forwarders) or make the function private (_name). Parse at the boundary instead of passing **kwargs through."
