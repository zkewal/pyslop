id: pyslop/no-dict-any
language: python
severity: error
rule:
  all:
    # Anchored: the node itself must be dict/Dict/Mapping/MutableMapping
    # (optionally module-qualified) with Any as the value type.
    # `Callable[[dict[str, int]], Any]` does not match.
    - any:
        - kind: generic_type
          regex: "^((\\w+\\.)*)(dict|Dict|Mapping|MutableMapping)\\[.+,\\s*(\\w+\\.)*Any\\]$"
        - kind: subscript
          regex: "^((\\w+\\.)*)(dict|Dict|Mapping|MutableMapping)\\[.+,\\s*(\\w+\\.)*Any\\]$"
    # Only annotations in a signature: a parameter type or a return type.
    # Works for methods and nested defs; local annotations in a body are skipped.
    - inside:
        kind: type
        stopBy: end
        any:
          - inside:
              any:
                - kind: typed_parameter
                - kind: typed_default_parameter
          - inside:
              kind: function_definition
              field: return_type
message: Function signature uses dict[str, Any] or Mapping[str, Any].
note: "Declare a data shape (TypedDict, dataclass, or pydantic model) instead of dict[str, Any] in parameters and returns. Local variables are allowed."
