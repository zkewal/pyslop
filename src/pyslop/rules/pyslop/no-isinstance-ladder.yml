id: pyslop/no-isinstance-ladder
language: python
severity: error
# Three isinstance($X, ...) branch conditions anywhere in one if/elif chain.
# Branches in between (other subjects, `x is None`, plain tests) do not break
# the chain. Either the `if` plus two elifs, or three elifs.
utils:
  elif-isinstance-x:
    kind: elif_clause
    has:
      field: condition
      pattern: isinstance($X, $_)
rule:
  all:
    - kind: if_statement
    - any:
        - all:
            - has:
                field: condition
                pattern: isinstance($X, $_)
            - has:
                matches: elif-isinstance-x
                follows:
                  stopBy: end
                  matches: elif-isinstance-x
        - has:
            matches: elif-isinstance-x
            follows:
              stopBy: end
              matches: elif-isinstance-x
              follows:
                stopBy: end
                matches: elif-isinstance-x
constraints:
  X:
    kind: identifier
message: Three or more isinstance() checks on one value in an if/elif chain.
note: Parse at the boundary instead (pydantic model or match statement).
