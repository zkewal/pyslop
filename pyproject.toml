[project]
name = "pyslop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kewal", email = "z.kewal@gmail.com" }
]
requires-python = ">=3.12"
scripts = { pyslop = "pyslop.cli:main" }
dependencies = [
    "ast-grep-cli>=0.45.3",
    "ruff>=0.16.6",
    "ty>=0.0.80",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
