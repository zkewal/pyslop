[project]
name = "pyslop"
version = "0.1.7"
description = "Deterministic anti-slop toolkit for Python: ruff + ty + ast-grep, vendored evidence rules"
readme = "README.md"
authors = [
    { name = "Kewal", email = "z.kewal@gmail.com" }
]
requires-python = ">=3.12"
scripts = { pyslop = "pyslop.cli:main" }
dependencies = [
    # Exact pins: `uv tool run --from git@tag` resolves from this metadata
    # and ignores uv.lock, so only == pins make installs reproducible.
    "ast-grep-cli==0.45.3",
    "pathspec==0.12.1",
    "ruff==0.16.6",
    "ty==0.0.80",
]

[project.urls]
Repository = "https://github.com/zkewal/pyslop"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
