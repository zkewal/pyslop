name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
      - run: uv run ast-grep test -c rules/sgconfig.yml
      - run: uv run ruff format --check
      - run: uv run pyslop check src tests/test_*.py
